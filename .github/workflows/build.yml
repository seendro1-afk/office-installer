name: Build macOS

on:
  push:
    branches: [main, "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release for the version in build-macos.sh"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          uname -m
          sw_vers
          swift --version

      - name: Build app and DMG
        run: ./build-macos.sh

      - name: Smoke test (app must stay running)
        run: |
          APP="macos/dist/Office Installer.app"
          # Make sure the SwiftPM build directory cannot be used as a fallback
          mv macos/.build macos/.build-hidden
          "$APP/Contents/MacOS/OfficeInstaller" > launch.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            echo "App is still running after 15 s"
            kill "$PID"
          else
            CODE=0; wait "$PID" || CODE=$?
            echo "App exited with code $CODE"
            cat launch.log
            exit 1
          fi
          mv macos/.build-hidden macos/.build

      - name: Checksum
        id: sum
        run: |
          DMG=$(ls macos/dist/*.dmg)
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: macos/dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(sed -n 's/.*OfficeInstaller-v\([0-9.]*\)-macOS.*/\1/p' build-macos.sh)"
          fi
          echo "Release tag: $TAG"
          cat > notes.md <<EOF
          Загрузка Office продолжается с места обрыва и автоматически повторяется при таймауте или потере связи.

          Требования: macOS 14 или новее, Apple Silicon.

          Сборка использует ad-hoc подпись и не нотариализована Apple. Если macOS блокирует запуск: System Settings → Privacy & Security → Open Anyway.

          SHA-256: \`${{ steps.sum.outputs.sha }}\`
          EOF
          gh release create "$TAG" "${{ steps.sum.outputs.dmg }}" \
            --target "$GITHUB_SHA" \
            --title "Office Installer $TAG" --notes-file notes.md
